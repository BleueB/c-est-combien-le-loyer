<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>C'est Combien Le Loyer ? 🏠</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="f7f4f804-d83d-4a62-807b-c05fbd748524"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="annonces.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #faf9f7; color: #1a1714;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 48px;
    }
    header {
      width: 100%;
      max-width: 640px;
      margin-bottom: 22px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #1a1714;
      margin: 0;
    }
    .live-score-pill {
      background: #fff8f5;
      color: #c4622d;
      border: 1px solid #f0d8cc;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .story-bars-wrap {
      margin-top: 10px;
    }
    .story-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .story-segment {
      height: 8px;
      border-radius: 999px;
      background: #e8e4de;
      overflow: hidden;
      position: relative;
      transition: background 0.25s ease;
    }
    .story-segment.green  { background: #16a34a; }
    .story-segment.yellow { background: #d97706; }
    .story-segment.red    { background: #dc2626; }
    .story-segment.active {
      background: #c4622d;
      box-shadow: 0 0 8px rgba(196,98,45,0.4);
      animation: pulseSegment 1.6s infinite ease-in-out;
    }
    @keyframes pulseSegment {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .story-legend {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #6b6560;
    }
    .card { background: #fff; border: 1px solid #e8e4de; border-radius: 16px; padding: 28px; max-width: 640px; width: 100%; box-shadow: 0 1px 4px rgba(26,23,20,0.06); }
    .annonce-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; color: #1a1714; }
    .annonce-ville { font-size: 0.85rem; color: #6b6560; margin-bottom: 18px; font-weight: 600; }
    .map-wrap { width: 100%; height: 200px; border-radius: 12px; border: 1px solid #e8e4de; margin-bottom: 18px; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    .badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
    .badge {
      background: #fff8f5;
      border: 1px solid #f0d8cc;
      border-radius: 10px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-icon {
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .badge-content {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .badge .label { font-size: 0.58rem; color: #c4622d; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 800; }
    .badge .value { font-size: 0.82rem; font-weight: 700; color: #1a1714; }
    .badge-full { grid-column: 1 / -1; }
    .badge-full .value { font-size: 0.88rem; line-height: 1.6; }
    .note {
      background: #fff8f5;
      border: 1px solid #f0d8cc;
      border-left: 3px solid #c4622d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.87rem;
      color: #6b6560;
      margin-bottom: 24px;
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .note-bubble-icon {
      font-size: 1.15rem;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .note-text {
      font-style: italic;
    }

    /* Animation tremblement / secousse quand score < 100 */
    @keyframes lowScoreShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-6px) rotate(-1.5deg); }
      30% { transform: translateX(5px) rotate(1.5deg); }
      45% { transform: translateX(-5px) rotate(-1deg); }
      60% { transform: translateX(4px) rotate(1deg); }
      75% { transform: translateX(-2px); }
    }
    .score-block.low-score {
      border-color: #fca5a5;
      background: #fff5f5;
      animation: lowScoreShake 0.6s ease-in-out;
    }
    .score-block.low-score .score-number {
      color: #dc2626;
    }

    /* Animation éclat / célébration quand score > 850 */
    @keyframes highScorePulse {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 0 16px rgba(22, 163, 74, 0.25); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }
    @keyframes emojiPop {
      0% { transform: scale(0.5) rotate(-10deg); }
      50% { transform: scale(1.3) rotate(8deg); }
      75% { transform: scale(0.95) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .score-block.high-score {
      border-color: #86efac;
      background: linear-gradient(180deg, #f0fdf4 0%, #fff8f5 100%);
      animation: highScorePulse 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .score-block.high-score .score-number {
      color: #16a34a;
    }
    .score-block.high-score .emoji-verdict {
      display: inline-block;
      animation: emojiPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Animation pinpoint qui atterrit avec rebond sur le toit */
    @keyframes pinDrop {
      0% {
        opacity: 0;
        transform: translateY(-45px) scale(0.6);
      }
      60% {
        opacity: 1;
        transform: translateY(2px) scale(1.15, 0.85);
      }
      80% {
        transform: translateY(-8px) scale(0.95, 1.05);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .custom-house-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
      animation: pinDrop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: bottom center;
    }

    .divider { border: none; border-top: 1px solid #e8e4de; margin: 20px 0; }
    .estimation-zone { text-align: center; }
    .estimation-zone label {
      display: block;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #1a1714;
    }
    .price-display-center {
      font-size: 2.8rem;
      font-weight: 900;
      color: #c4622d;
      line-height: 1;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
    }
    .slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    input[type=range] { flex: 1; -webkit-appearance: none; height: 6px; border-radius: 4px; background: #f0d8cc; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #c4622d; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(196,98,45,0.35); cursor: pointer; }
    .amount-input { width: 106px; padding: 9px 10px; border: 1.5px solid #e8e4de; border-radius: 8px; font-size: 1rem; font-weight: 700; text-align: center; color: #1a1714; outline: none; transition: border-color 0.15s; }
    .amount-input:focus { border-color: #c4622d; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #6b6560; margin-bottom: 20px; padding: 0 2px; }
    .btn-valider { width: 100%; padding: 14px; background: #c4622d; color: #fff; font-size: 1.05rem; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; transition: background 0.15s; letter-spacing: 0.01em; }
    .btn-valider:hover { background: #a8501f; }
    .resultat { display: none; margin-top: 24px; }
    .score-block { text-align: center; padding: 26px 16px 20px; background: #fff8f5; border: 1px solid #f0d8cc; border-radius: 16px; margin-bottom: 18px; }
    .emoji-verdict { font-size: 2.4rem; margin-bottom: 6px; }
    .score-label { font-size: 0.82rem; color: #6b6560; margin-bottom: 4px; }
    .score-number { font-size: 3.2rem; font-weight: 900; color: #c4622d; line-height: 1; }
    .score-max { font-size: 0.85rem; color: #6b6560; margin-top: 4px; }
    .verdict-text { font-size: 1rem; font-weight: 700; color: #1a1714; margin-top: 10px; }
    .verdict-sub { font-size: 0.83rem; color: #6b6560; margin-top: 3px; }
    .reveal-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e8e4de; border-radius: 10px; padding: 13px 16px; margin-bottom: 10px; }
    .reveal-row .rl { font-size: 0.83rem; color: #6b6560; }
    .reveal-row .rv { font-size: 1.05rem; font-weight: 700; }
    .reveal-row .rv.green { color: #16a34a; }
    .reveal-row .rv.orange { color: #d97706; }
    .reveal-row .rv.red { color: #dc2626; }
    .precision-wrap { margin-bottom: 20px; }
    .precision-label { font-size: 0.78rem; color: #6b6560; margin-bottom: 6px; }
    .precision-bg { background: #f0d8cc; border-radius: 6px; height: 10px; overflow: hidden; }
    .precision-fill { height: 10px; border-radius: 6px; background: linear-gradient(to right, #c4622d, #7c3d8f); transition: width 0.7s cubic-bezier(.4,0,.2,1); width: 0%; }
    .btn-annonce { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 0.95rem; margin-bottom: 10px; transition: opacity 0.15s; background: #fff; border: 2px solid transparent; }
    .btn-annonce:hover { opacity: 0.75; }
    .btn-annonce.source-sl  { color: #e31937; border-color: #e31937; }
    .btn-annonce.source-bi  { color: #f5a623; border-color: #f5a623; }
    .btn-annonce.source-pap { color: #1a5fa8; border-color: #1a5fa8; }
    .btn-annonce.source-lbc { color: #ff6e14; border-color: #ff6e14; }
    .btn-annonce.source-def { color: #c4622d; border-color: #c4622d; }
    .badge-source { display: inline-flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; border: 2px solid currentColor; line-height: 1.4; }
    .btn-partager { width: 100%; padding: 13px; background: #1a1714; color: #fff; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
    .btn-partager:hover { background: #333; }
    .btn-suivante { width: 100%; padding: 13px; background: #c4622d; color: #fff; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: background 0.15s; margin-top: 10px; }
    .btn-suivante:hover { background: #a8501f; }
    .recap-block { text-align: center; padding: 32px 20px 24px; }
    .recap-emoji { font-size: 3rem; margin-bottom: 10px; }
    .recap-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 6px; color: #1a1714; }
    .recap-sub { font-size: 0.9rem; color: #6b6560; margin-bottom: 24px; }
    .recap-score-label { font-size: 0.82rem; color: #6b6560; margin-bottom: 4px; }
    .recap-score { font-size: 3.5rem; font-weight: 900; color: #c4622d; line-height: 1; margin-bottom: 4px; }
    .recap-score-max { font-size: 0.88rem; color: #6b6560; margin-bottom: 24px; }
    .recap-detail { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; text-align: left; }
    .recap-ligne { display: flex; justify-content: space-between; align-items: center; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; border: 1.5px solid transparent; }
    .recap-ligne.vert   { background: #f0fdf4; border-color: #86efac; }
    .recap-ligne.orange { background: #fffbeb; border-color: #fcd34d; }
    .recap-ligne.rouge  { background: #fff1f2; border-color: #fca5a5; }
    .recap-ligne .rl { color: #6b6560; }
    .recap-ligne .rv { font-weight: 700; }
    .recap-ligne.vert   .rv { color: #16a34a; }
    .recap-ligne.orange .rv { color: #d97706; }
    .recap-ligne.rouge  .rv { color: #dc2626; }
    .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .nav-btn { background: #fff8f5; border: 1px solid #e8e4de; border-radius: 8px; padding: 7px 14px; font-size: 0.88rem; font-weight: 700; color: #1a1714; cursor: pointer; transition: background 0.15s; }
    .nav-btn:hover { background: #f0d8cc; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-counter { font-size: 0.85rem; font-weight: 700; color: #6b6560; }
    footer { margin-top: 36px; text-align: center; font-size: 0.75rem; color: #b5afa8; border-top: 1px solid #e8e4de; padding-top: 14px; width: 100%; max-width: 640px; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🏠 C'est Combien Le Loyer ?</h1>
    <span class="live-score-pill" id="liveScorePill">✨ 0 pt</span>
  </div>

  <div class="story-bars-wrap">
    <div class="story-grid" id="storyGrid">
      <div class="story-segment active"></div>
      <div class="story-segment"></div>
      <div class="story-segment"></div>
      <div class="story-segment"></div>
      <div class="story-segment"></div>
    </div>
    <div class="story-legend">
      <span id="storyStepText">Manche 1 sur 5</span>
      <span id="headerSub">Partie du jour</span>
    </div>
  </div>
</header>

<div class="card" id="card">
  <p style="text-align:center;color:#57606a;padding:40px 0">Chargement…</p>
</div>

<footer>
  <a href="index.html" style="color:#adb5bd;text-decoration:none">← Accueil</a>
  &nbsp;·&nbsp; C'est Combien Le Loyer ?
</footer>

<script>
  const SLIDER_MIN = 200;
  const SLIDER_MAX = 10000;
  const SLIDER_DEFAULT = Math.round((SLIDER_MIN + SLIDER_MAX) / 2);
  const NB_MANCHES = 5;
  const DATE_LANCEMENT = new Date('2026-09-23'); // Date de lancement

  const BADGE_ICONS = {
    'surface': '📐',
    'pièces': '🚪',
    'étage': '🏢',
    'meublé': '🪑',
    'parking': '🚗',
    'extérieur': '🌿',
    'année construction': '📅',
    'état': '✨',
    'dpe': '⚡',
    'chauffage': '🔥',
    'exposition': '☀️',
    'transports': '🚇'
  };

  function getBadgeIcon(label) {
    const k = (label || '').toLowerCase();
    for (const key in BADGE_ICONS) {
      if (k.includes(key)) return BADGE_ICONS[key];
    }
    return '📌';
  }

  const DEPARTEMENTS = {
    '01':'Ain','02':'Aisne','03':'Allier','04':'Alpes-de-Haute-Provence','05':'Hautes-Alpes',
    '06':'Alpes-Maritimes','07':'Ardèche','08':'Ardennes','09':'Ariège','10':'Aube',
    '11':'Aude','12':'Aveyron','13':'Bouches-du-Rhône','14':'Calvados','15':'Cantal',
    '16':'Charente','17':'Charente-Maritime','18':'Cher','19':'Corrèze','2A':'Corse-du-Sud',
    '2B':'Haute-Corse','21':'Côte-d\'Or','22':'Côtes-d\'Armor','23':'Creuse','24':'Dordogne',
    '25':'Doubs','26':'Drôme','27':'Eure','28':'Eure-et-Loir','29':'Finistère',
    '30':'Gard','31':'Haute-Garonne','32':'Gers','33':'Gironde','34':'Hérault',
    '35':'Ille-et-Vilaine','36':'Indre','37':'Indre-et-Loire','38':'Isère','39':'Jura',
    '40':'Landes','41':'Loir-et-Cher','42':'Loire','43':'Haute-Loire','44':'Loire-Atlantique',
    '45':'Loiret','46':'Lot','47':'Lot-et-Garonne','48':'Lozère','49':'Maine-et-Loire',
    '50':'Manche','51':'Marne','52':'Haute-Marne','53':'Mayenne','54':'Meurthe-et-Moselle',
    '55':'Meuse','56':'Morbihan','57':'Moselle','58':'Nièvre','59':'Nord',
    '60':'Oise','61':'Orne','62':'Pas-de-Calais','63':'Puy-de-Dôme','64':'Pyrénées-Atlantiques',
    '65':'Hautes-Pyrénées','66':'Pyrénées-Orientales','67':'Bas-Rhin','68':'Haut-Rhin','69':'Rhône',
    '70':'Haute-Saône','71':'Saône-et-Loire','72':'Sarthe','73':'Savoie','74':'Haute-Savoie',
    '75':'Paris','76':'Seine-Maritime','77':'Seine-et-Marne','78':'Yvelines','79':'Deux-Sèvres',
    '80':'Somme','81':'Tarn','82':'Tarn-et-Garonne','83':'Var','84':'Vaucluse',
    '85':'Vendée','86':'Vienne','87':'Haute-Vienne','88':'Vosges','89':'Yonne',
    '90':'Territoire de Belfort','91':'Essonne','92':'Hauts-de-Seine','93':'Seine-Saint-Denis',
    '94':'Val-de-Marne','95':'Val-d\'Oise','971':'Guadeloupe','972':'Martinique',
    '973':'Guyane','974':'La Réunion','976':'Mayotte',
  };

  function getDepartement(annonce) {
    if (annonce.departement) return annonce.departement;
    // Fallback : extraire depuis le CP dans ville ou titre
    const cp = (annonce.ville + ' ' + (annonce.titre || '')).match(/\b(\d{5})\b/);
    if (!cp) return null;
    const code = cp[1].slice(0, 2);
    return DEPARTEMENTS[code] || null;
  }

  let currentIndex = 0;
  let ordre = [];
  let scores = [];
  let numJour = 1;

  // --- JOUR ---
  function getNumJour() {
    const testJour = parseInt(localStorage.getItem('cctl_testJour') || '');
    if (!isNaN(testJour) && testJour > 0) return testJour;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.floor((today - DATE_LANCEMENT) / 86400000) + 1;
    return Math.max(diff, 1);
  }

  function getAnnoncesDuJour(num) {
    return ANNONCES.filter(a => a.jour === num);
  }

  // --- SAUVEGARDE QUOTIDIENNE ---
  function chargerSauvegarde(num) {
    try {
      const data = JSON.parse(localStorage.getItem('cctl_quotidien') || '{}');
      if (data.jour === num) return data;
    } catch {}
    return { jour: num, scores: [], index: 0, termine: false };
  }

  function sauvegarder() {
    const data = { jour: numJour, scores, index: currentIndex, termine: currentIndex >= NB_MANCHES };
    localStorage.setItem('cctl_quotidien', JSON.stringify(data));
  }

  // --- SOURCE BADGE ---
  function sourceAbbrev(source) {
    if (!source) return '?';
    const s = source.toLowerCase();
    if (s.includes('seloger')) return 'SL';
    if (s.includes('bien'))    return 'BI';
    if (s.includes('pap'))     return 'PAP';
    if (s.includes('boncoin') || s.includes('leboncoin')) return 'LBC';
    return source.slice(0, 3).toUpperCase();
  }
  function sourceCssClass(source) {
    if (!source) return 'source-def';
    const s = source.toLowerCase();
    if (s.includes('seloger')) return 'source-sl';
    if (s.includes('bien'))    return 'source-bi';
    if (s.includes('pap'))     return 'source-pap';
    if (s.includes('boncoin') || s.includes('leboncoin')) return 'source-lbc';
    return 'source-def';
  }

  function updateStoryHeader() {
    const segs = document.querySelectorAll('.story-segment');
    let totalScore = 0;
    
    segs.forEach((seg, i) => {
      seg.className = 'story-segment';
      if (scores[i] !== undefined) {
        totalScore += scores[i].score;
        if (scores[i].score >= 700) seg.classList.add('green');
        else if (scores[i].score >= 300) seg.classList.add('yellow');
        else seg.classList.add('red');
      } else if (i === currentIndex) {
        seg.classList.add('active');
      }
    });

    const liveScoreEl = document.getElementById('liveScorePill');
    if (liveScoreEl) liveScoreEl.textContent = `✨ ${totalScore.toLocaleString('fr-FR')} pts`;
    const stepEl = document.getElementById('storyStepText');
    if (stepEl) stepEl.textContent = `Manche ${Math.min(currentIndex + 1, NB_MANCHES)} sur ${NB_MANCHES}`;
  }

  // --- RENDER ---
  function renderAnnonce(a) {
    updateStoryHeader();
    const pos = currentIndex + 1;
    const badgesHTML = a.badges.map(b =>
      `<div class="badge"><span class="badge-icon">${getBadgeIcon(b.label)}</span><div class="badge-content"><span class="label">${b.label}</span><span class="value">${b.value}</span></div></div>`
    ).join('');

    document.getElementById('card').innerHTML = `
      <div class="nav-bar">
        <button class="nav-btn" onclick="goTo(currentIndex - 1)" ${currentIndex === 0 ? 'disabled' : ''}>← Précédente</button>
        <span class="nav-counter">${pos} / ${NB_MANCHES}</span>
        <button class="nav-btn" onclick="goTo(currentIndex + 1)" ${scores[currentIndex] === undefined || currentIndex === NB_MANCHES - 1 ? 'disabled' : ''}>Suivante →</button>
      </div>
      <div class="annonce-title" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span>📍 ${a.titre || (a.ville + (a.tooltip && a.tooltip !== a.ville ? ' · ' + a.tooltip : ''))}</span>
        ${getDepartement(a) ? `<span style="background:#f0f2f5;color:#57606a;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap">${getDepartement(a)}</span>` : ''}
      </div>
      <div class="annonce-ville">${a.ville}${a.sous_titre ? ' · ' + a.sous_titre : ''}</div>
      <div class="map-wrap"><div id="map"></div></div>
      <div class="badge-grid">
        ${badgesHTML}
        ${a.particularites ? `<div class="badge badge-full"><span class="badge-icon">✨</span><div class="badge-content"><span class="label">Particularités</span><span class="value">${a.particularites}</span></div></div>` : ''}
      </div>
      ${a.note ? `<div class="note"><span class="note-bubble-icon">💬</span><div class="note-text">${a.note}</div></div>` : ''}
      <hr class="divider" />
      <div class="estimation-zone" id="zoneEstimation">
        <label>Ton estimation loyer charges comprises</label>
        <div class="price-display-center" id="priceDisplayCentred">${SLIDER_DEFAULT.toLocaleString('fr-FR')} €</div>
        <div class="slider-row">
          <input type="range" id="slider" min="${SLIDER_MIN}" max="${SLIDER_MAX}" value="${SLIDER_DEFAULT}" step="50"
            oninput="syncFromSlider(this.value)" />
          <input type="number" id="montant" class="amount-input" value="${SLIDER_DEFAULT}"
            min="${SLIDER_MIN}" max="${SLIDER_MAX}" oninput="syncFromInput(this.value)" />
        </div>
        <div class="slider-labels">
          <span>${SLIDER_MIN.toLocaleString('fr-FR')} €</span>
          <span>${Math.round((SLIDER_MIN + SLIDER_MAX) / 2).toLocaleString('fr-FR')} €</span>
          <span>${SLIDER_MAX.toLocaleString('fr-FR')} €</span>
        </div>
        <button class="btn-valider" onclick="valider()">Valider mon estimation →</button>
      </div>
      <div class="resultat" id="resultat" style="display:none">
        <div class="score-block">
          <div class="emoji-verdict" id="emojiVerdict">🎯</div>
          <div class="score-label">Votre score</div>
          <div class="score-number" id="scoreAffiche">0</div>
          <div class="score-max">/ 1 000 points</div>
          <div class="verdict-text" id="verdictText"></div>
          <div class="verdict-sub" id="verdictSub"></div>
        </div>
        <div class="reveal-row">
          <span class="rl">Votre estimation</span>
          <span class="rv" id="estimAffiche">—</span>
        </div>
        <div class="reveal-row">
          <span class="rl">Loyer réel (CC)</span>
          <span class="rv green" id="loyerReel">${a.loyer.toLocaleString('fr-FR')} €/mois</span>
        </div>
        <div class="precision-wrap">
          <div class="precision-label">Précision</div>
          <div class="precision-bg"><div class="precision-fill" id="precisionFill"></div></div>
        </div>
        ${a.lien ? `<a href="${a.lien}" target="_blank" rel="noopener" class="btn-annonce ${sourceCssClass(a.source)}" onclick="trackVoirAnnonce(this)">
          <span class="badge-source">${sourceAbbrev(a.source)}</span>
          Voir l'annonce
        </a>` : ''}
        <button class="btn-suivante" id="btnSuivante" style="display:none" onclick="goTo(currentIndex + 1)">
          Annonce suivante →
        </button>
        <button class="btn-suivante" id="btnRecap" style="display:none;background:#7c5cd8" onclick="afficherRecap()">
          Voir mon récap 🏁
        </button>
      </div>
    `;

    // Restaurer résultat si déjà joué
    if (scores[currentIndex] !== undefined) {
      afficherResultatExistant(scores[currentIndex], a);
    }

    initMap(a);
    updateSliderBg(SLIDER_DEFAULT);
  }

  function afficherResultatExistant(r, a) {
    const v = getVerdict(r.score, r.ecart);
    document.getElementById('emojiVerdict').textContent = v.emoji;
    document.getElementById('verdictText').textContent = v.text;
    document.getElementById('verdictSub').textContent = v.sub;
    document.getElementById('estimAffiche').textContent = r.estimation.toLocaleString('fr-FR') + ' €';
    const ecartAbs = Math.abs(r.ecart);
    const colorClass = ecartAbs <= 50 ? 'green' : ecartAbs <= 150 ? 'orange' : 'red';
    const ecartStr = (r.ecart >= 0 ? '+' : '') + r.ecart.toLocaleString('fr-FR') + ' €';
    document.getElementById('loyerReel').innerHTML = `${a.loyer.toLocaleString('fr-FR')} €/mois <span style="font-size:0.82rem;font-weight:600" class="${colorClass}">(${ecartStr})</span>`;
    setTimeout(() => { document.getElementById('precisionFill').style.width = (r.score / 10) + '%'; }, 120);
    document.getElementById('scoreAffiche').textContent = r.score;
    const scoreBlock = document.querySelector('.score-block');
    if (scoreBlock) {
      scoreBlock.classList.remove('low-score', 'high-score');
      if (r.score < 100) scoreBlock.classList.add('low-score');
      else if (r.score > 850) scoreBlock.classList.add('high-score');
    }
    document.getElementById('zoneEstimation').style.display = 'none';
    document.getElementById('resultat').style.display = 'block';
    const estDerniere = currentIndex === NB_MANCHES - 1;
    document.getElementById('btnSuivante').style.display = estDerniere ? 'none' : 'block';
    document.getElementById('btnRecap').style.display = estDerniere ? 'block' : 'none';
  }

  // --- RÉCAP ---
  function getVerdictGlobal(total, max) {
    const pct = total / max;
    if (pct >= 0.9) return { emoji: '🏆', text: 'Expert du marché immo !', sub: pick(['Vous pouvez ouvrir votre agence.', 'On ne vous la fait pas.', 'Vous connaissez les prix sur le bout des doigts.', 'Chasseur immobilier en secret ?']) };
    if (pct >= 0.7) return { emoji: '🌟', text: 'Très bon score !', sub: pick(['Vous sentez le marché.', 'Quelques loyers vous ont résisté, mais pas beaucoup.', 'Les agences tremblent.', 'Vous avez l\'œil pour les prix.']) };
    if (pct >= 0.5) return { emoji: '🙂', text: 'Pas mal du tout !', sub: pick(['Vous commencez à sentir le marché.', 'Ni agent immo, ni novice — quelque part entre les deux.', 'Dans la moyenne, c\'est déjà ça !', 'Le marché ne vous a pas totalement eu.']) };
    if (pct >= 0.3) return { emoji: '😬', text: 'Peut mieux faire…', sub: pick(['Le marché vous a bien eu.', 'Le marché garde ses secrets.', 'Encore quelques parties et vous y serez.', 'Les loyers sont retors.']) };
    return { emoji: '💸', text: 'Aïe aïe aïe !', sub: pick(['Vous découvrez le marché immo français ?', 'Le marché n\'a fait qu\'une bouchée de vous.', 'Revenez demain, ça ira mieux !', 'Les prix vous ont bien eu cette fois.']) };
    // Variantes niçoises conservées : 'Tu débarques de Paris ?', 'En vacances dans la région, peut-être ?', 'Uno di noi !'
  }

  function afficherRecap() {
    const total = scores.reduce((s, r) => s + r.score, 0);
    const max = NB_MANCHES * 1000;
    const v = getVerdictGlobal(total, max);
    if (typeof umami !== 'undefined') umami.track('partie-terminee', { score: total, jour: numJour });

    // Emojis style Wordle
    const emojisPartage = scores.map(r => {
      const pct = r.score / 1000;
      if (pct >= 0.9) return '🟩';
      if (pct >= 0.6) return '🟨';
      return '🟥';
    }).join('');

    const lignesHTML = scores.map((r, i) => {
      const a = ordre[i];
      const ecartStr = (r.ecart >= 0 ? '+' : '') + r.ecart.toLocaleString('fr-FR') + ' €';
      const couleur = r.score >= 700 ? 'vert' : r.score >= 300 ? 'orange' : 'rouge';
      return `
        <div class="recap-ligne ${couleur}">
          <span class="rl" style="flex:1;min-width:0;margin-right:10px">${i + 1}. ${a.ville}${a.tooltip && a.tooltip !== a.ville ? ' · ' + a.tooltip : ''}</span>
          <span style="display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap">
            <span class="rv">${r.score} pts</span>
            <span class="rv" style="font-size:0.8rem">${ecartStr}</span>
            ${a.lien ? `<a href="${a.lien}" target="_blank" rel="noopener" class="btn-annonce ${sourceCssClass(a.source)}" style="margin:0;padding:3px 0;font-size:0.75rem;border-width:1.5px;white-space:nowrap;width:64px;justify-content:center" onclick="trackVoirAnnonce(this,'recap')">
              <span class="badge-source" style="font-size:0.65rem;padding:1px 5px">${sourceAbbrev(a.source)}</span> →
            </a>` : ''}
          </span>
        </div>`;
    }).join('');

    document.getElementById('card').innerHTML = `
      <div class="recap-block">
        <div class="recap-emoji">${v.emoji}</div>
        <div class="recap-title">${v.text}</div>
        <div class="recap-sub">${v.sub}</div>
        <div class="recap-score-label">Score — Partie #${numJour}</div>
        <div class="recap-score" id="recapScoreAnim">0</div>
        <div class="recap-score-max">/ ${max.toLocaleString('fr-FR')} points</div>
      </div>
      <div class="recap-detail">${lignesHTML}</div>
      <button class="btn-partager" onclick="partagerRecap(${total}, ${max}, '${emojisPartage}')">📤 Partager mon score</button>
    `;

    animerScoreEl(document.getElementById('recapScoreAnim'), total);
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Marquer comme terminé
    sauvegarder();
  }

  function trackVoirAnnonce(el, context) {
    if (typeof umami === 'undefined') return;
    const url = el.href || '';
    const plateforme = url.includes('seloger') ? 'SeLoger' : url.includes('bienici') ? "Bien'ici" : url.includes('pap.fr') ? 'PAP' : url.includes('leboncoin') ? 'LeBonCoin' : '?';
    umami.track('voir-annonce', { plateforme, context: context || 'manche' });
  }

  function partagerRecap(total, max, emojis) {
    const lien = 'https://bleueb.github.io/c-est-combien-le-loyer/';
    const texte = `🏠 C'est Combien Le Loyer ? — Partie #${numJour}\n${emojis}\n${total} / ${max} pts\n${lien}`;
    if (typeof umami !== 'undefined') umami.track('score-partage', { score: total, jour: numJour });
    if (navigator.share) {
      navigator.share({ title: "C'est Combien Le Loyer ?", text: texte }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(texte).then(() => {
        const btn = document.querySelector('.btn-partager');
        const original = btn.innerHTML;
        btn.innerHTML = '✅ Score copié !';
        btn.disabled = true;
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
      });
    }
  }

  // --- MAP ---
  function initMap(a) {
    const map = L.map('map', { zoomControl: true, scrollWheelZoom: false, dragging: true, attributionControl: false }).setView(a.coords, a.zoom || 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.control.attribution({ prefix: '© OpenStreetMap' }).addTo(map);
    map.on('click', () => map.scrollWheelZoom.enable());
    map.on('mouseout', () => map.scrollWheelZoom.disable());
    const pinIcon = L.divIcon({
      html: '<div class="custom-house-pin">📍</div>',
      className: '', iconSize: [26, 26], iconAnchor: [13, 24]
    });
    L.marker(a.coords, { icon: pinIcon }).addTo(map)
      .bindTooltip(a.tooltip || a.ville, { permanent: true, direction: 'top', offset: [0,-22] });
    const ResetControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: () => {
        const btn = L.DomUtil.create('button');
        btn.innerHTML = '⌖';
        btn.style.cssText = 'background:#fff;border:2px solid rgba(0,0,0,0.2);border-radius:4px;width:30px;height:30px;font-size:1.1rem;cursor:pointer;line-height:1;color:#444;';
        btn.onmouseover = () => btn.style.background = '#f4f4f4';
        btn.onmouseout  = () => btn.style.background = '#fff';
        L.DomEvent.on(btn, 'click', () => map.setView(a.coords, a.zoom || 15));
        return btn;
      }
    });
    map.addControl(new ResetControl());
  }

  // --- SLIDER ---
  function updateSliderBg(val) {
    const pct = ((val - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN)) * 100;
    const slider = document.getElementById('slider');
    if (slider) {
      slider.style.background =
        `linear-gradient(to right, #c4622d 0%, #c4622d ${pct}%, #f0d8cc ${pct}%, #f0d8cc 100%)`;
    }
  }
  function syncFromSlider(val) {
    document.getElementById('montant').value = val;
    const priceEl = document.getElementById('priceDisplayCentred');
    if (priceEl) priceEl.textContent = Number(val).toLocaleString('fr-FR') + ' €';
    updateSliderBg(val);
  }
  function syncFromInput(val) {
    const v = Math.min(Math.max(parseInt(val) || SLIDER_MIN, SLIDER_MIN), SLIDER_MAX);
    document.getElementById('slider').value = v;
    const priceEl = document.getElementById('priceDisplayCentred');
    if (priceEl) priceEl.textContent = Number(v).toLocaleString('fr-FR') + ' €';
    updateSliderBg(v);
  }

  // --- SCORE ---
  function calculerScore(estimation, reel) {
    const ecart = Math.abs(estimation - reel);
    const sigma = reel * 0.25;
    return Math.round(1000 * Math.exp(-(ecart * ecart) / (2 * sigma * sigma)));
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function getVerdict(score, ecart = 0) {
    if (score >= 900) {
      const subs = [
        'Vrai expert immo ou vrai coup de chance ?',
        'J\'en connais un qui tient les comptes.',
        'On ne te la fait pas, à toi.',
        'Une vision d\'aigle…',
        'Chasseur immobilier en secret ?',
        'T\'es le propriétaire ou quoi ?',
        'Même l\'agent immobilier n\'était pas aussi précis.',
        'Tu passes trop de temps sur SeLoger le dimanche soir.',
        'Dossier accepté sans garant, direct.',
        'Stéphane Plaza en sueur.',
        'Tu as le bail sous les yeux, avoue.'
      ];
      return { emoji: '🎯', text: pick(['Trop fort !', 'Monstrueux !', 'Parfait !', 'Redoutable !']), sub: pick(subs) };
    }

    if (score >= 700) {
      const subs = [
        'Vous connaissez bien ce marché !',
        'Vous avez déjà cherché un appart par ici ?',
        'Excellent sens du marché.',
        'On sent que tu as déjà épluché les annonces du coin.',
        'Presque au centime près, respect.',
        'L\'œil du pro, il te manquait juste le coût du local vélo.'
      ];
      return { emoji: '🔥', text: pick(['Vraiment pas mal !', 'Vous avez l\'œil !', 'Solide !']), sub: pick(subs) };
    }

    if (score >= 450) {
      const subs = [
        'Ce marché vous réserve encore des surprises.',
        'Vous vous défendez bien !',
        'Pas loin !',
        'Pas si loin, mais le proprio a été un poil plus gourmand.',
        'Tu as oublié de compter les charges de copro ?',
        'Le marché a encore quelques petits secrets pour toi.',
        'C\'est le supplément "charme de l\'ancien" qui t\'a trompé.'
      ];
      return { emoji: '👍', text: pick(['Peut mieux faire !', 'Dans la bonne fourchette !']), sub: pick(subs) };
    }

    if (score >= 150) {
      const subs = [
        'Les loyers sont retors par ici…',
        'Le marché vous a eu cette fois !',
        'Difficile à estimer !',
        'À ce prix-là, t\'as juste la cave et le local poubelles.',
        'Tu as estimé les prix en francs ou quoi ?'
      ];
      if (ecart < 0) {
        subs.push('Le propriétaire vient de faire un malaise en voyant ton offre.');
      }
      return { emoji: '😅', text: 'Ouch !', sub: pick(subs) };
    }

    const subs = [
      'Le marché n\'a pas fini de vous surprendre.',
      'Vous découvrez le marché immo français ?',
      'Revenez demain !',
      'Dossier refusé immédiatement, même avec 12 garants en CDI.',
      'Complètement à côté de la plaque (et du département).'
    ];
    if (ecart < 0) {
      subs.push('Tu vis encore chez tes parents, non ?');
    }
    return { emoji: '💸', text: 'Aïe !', sub: pick(subs) };
  }

  function valider() {
    const estimation = parseInt(document.getElementById('montant').value) || SLIDER_DEFAULT;
    const a = ordre[currentIndex];
    const score = calculerScore(estimation, a.loyer);
    const ecart = estimation - a.loyer;
    const ecartAbs = Math.abs(ecart);
    const verdict = getVerdict(score, ecart);
    scores[currentIndex] = { estimation, score, ecart };
    sauvegarder();
    updateStoryHeader();

    document.getElementById('emojiVerdict').textContent = verdict.emoji;
    document.getElementById('verdictText').textContent = verdict.text;
    document.getElementById('verdictSub').textContent = verdict.sub;
    document.getElementById('estimAffiche').textContent = estimation.toLocaleString('fr-FR') + ' €';
    const colorClass = ecartAbs <= 50 ? 'green' : ecartAbs <= 150 ? 'orange' : 'red';
    const ecartStr = (ecart >= 0 ? '+' : '') + ecart.toLocaleString('fr-FR') + ' €';
    document.getElementById('loyerReel').innerHTML = `${a.loyer.toLocaleString('fr-FR')} €/mois <span style="font-size:0.82rem;font-weight:600" class="${colorClass}">(${ecartStr})</span>`;
    setTimeout(() => { document.getElementById('precisionFill').style.width = (score / 10) + '%'; }, 120);
    animerScore(score);
    const scoreBlock = document.querySelector('.score-block');
    if (scoreBlock) {
      scoreBlock.classList.remove('low-score', 'high-score');
      if (score < 100) scoreBlock.classList.add('low-score');
      else if (score > 850) scoreBlock.classList.add('high-score');
    }
    document.getElementById('zoneEstimation').style.display = 'none';
    document.getElementById('resultat').style.display = 'block';
    const estDerniere = currentIndex === NB_MANCHES - 1;
    document.getElementById('btnSuivante').style.display = estDerniere ? 'none' : 'block';
    document.getElementById('btnRecap').style.display = estDerniere ? 'block' : 'none';
    document.getElementById('resultat').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    sauvegarder();
  }

  function animerScore(score) { animerScoreEl(document.getElementById('scoreAffiche'), score); }
  function animerScoreEl(el, cible) {
    const duree = 900, debut = Date.now();
    function tick() {
      const t = Math.min((Date.now() - debut) / duree, 1);
      el.textContent = Math.round((1 - Math.pow(1 - t, 3)) * cible);
      if (t < 1) requestAnimationFrame(tick); else el.textContent = cible;
    }
    requestAnimationFrame(tick);
  }

  // --- NAVIGATION ---
  function goTo(index) {
    if (index < 0 || index >= NB_MANCHES) return;
    currentIndex = index;
    renderAnnonce(ordre[currentIndex]);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // --- INIT ---
  numJour = getNumJour();
  document.getElementById('headerSub').textContent = `Partie #${numJour}`;

  const annonces = getAnnoncesDuJour(numJour);

  if (annonces.length < NB_MANCHES) {
    document.getElementById('card').innerHTML = `
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:2rem;margin-bottom:16px">🔜</div>
        <div style="font-weight:800;font-size:1.1rem;margin-bottom:8px">Partie #${numJour} pas encore disponible</div>
        <div style="color:#57606a;font-size:0.9rem;margin-bottom:24px">Revenez demain !</div>
        <a href="index.html" style="color:#3b82d4;font-weight:700">← Retour à l'accueil</a>
      </div>`;
  } else {
    ordre = annonces;

    // Restaurer progression
    const save = chargerSauvegarde(numJour);
    scores = save.scores || [];
    currentIndex = Math.min(save.index || 0, NB_MANCHES - 1);

    // Si partie déjà terminée, aller direct au récap
    if (save.termine) {
      afficherRecap();
    } else {
      renderAnnonce(ordre[currentIndex]);
    }
  }
</script>

</body>
</html>
