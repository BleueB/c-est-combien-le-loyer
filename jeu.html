  <div class="annonce-title" id="annonceTitleWrap" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span id="annonceTitleText">📍 Chargement…</span>
    <span id="annonceDeptTag" style="background:#f0f2f5;color:#57606a;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;display:none"></span>
  </div>
  <div class="annonce-ville" id="annonceVilleText"></div>
  <div class="map-wrap"><div id="map"></div></div>
  <div class="badge-grid" id="badgeGridWrap"></div>
  <div class="note" id="noteWrap" style="display:none"><span class="note-bubble-icon">💬</span><div class="note-text" id="noteText"></div></div>
  <hr class="divider" />
  <div class="estimation-zone" id="zoneEstimation">
    <label>Ton estimation loyer charges comprises</label>
    <div class="price-display-center" id="priceDisplayCentred">1 000 €</div>
    <div class="slider-row">
      <input type="range" id="slider" min="200" max="10000" value="1000" step="10"
        oninput="syncFromSlider(this.value)" />
    </div>
    <div class="quick-btns-row">
      <button type="button" class="btn-step" onclick="adjustAmount(-50)">-50 €</button>
      <button type="button" class="btn-step" onclick="adjustAmount(-10)">-10 €</button>
      <button type="button" class="btn-step" onclick="adjustAmount(10)">+10 €</button>
      <button type="button" class="btn-step" onclick="adjustAmount(50)">+50 €</button>
    </div>
    <div class="slider-labels">
      <span>200 €</span>
      <span>5 000 €</span>
      <span>10 000 €</span>
    </div>
    <button class="btn-valider" onclick="valider()">Valider mon estimation →</button>
  </div>
  <div class="resultat" id="resultat" style="display:none">
    <div class="score-block">
      <div class="emoji-verdict" id="emojiVerdict">🎯</div>
      <div class="score-label">Votre score</div>
      <div class="score-number" id="scoreAffiche">0</div>
      <div class="score-max">/ 1 000 points</div>
      <div class="verdict-text" id="verdictText"></div>
      <div class="verdict-sub" id="verdictSub"></div>
    </div>
    <div class="reveal-row">
      <span class="rl">Votre estimation</span>
      <span class="rv" id="estimAffiche">—</span>
    </div>
    <div class="reveal-row">
      <span class="rl">Loyer réel (CC)</span>
      <span class="rv green" id="loyerReel">—</span>
    </div>
    <div class="precision-wrap">
      <div class="precision-label">Précision</div>
      <div class="precision-bg"><div class="precision-fill" id="precisionFill"></div></div>
    </div>
    <div id="btnAnnonceWrap"></div>
    <button class="btn-suivante" id="btnSuivante" style="display:none" onclick="goTo(currentIndex + 1)">
      Annonce suivante →
    </button>
    <button class="btn-suivante" id="btnRecap" style="display:none;background:#7c5cd8" onclick="afficherRecap()">
      Voir mon récap 🏁
    </button>
  </div>
</div>

<footer>
  <a href="index.html" style="color:#adb5bd;text-decoration:none">← Accueil</a>
  &nbsp;·&nbsp; C'est Combien Le Loyer ?
</footer>

<script>
  const SLIDER_MIN = 200;
  const SLIDER_MAX = 10000;
  const SLIDER_DEFAULT = 1000;
  const NB_MANCHES = 5;
  const DATE_LANCEMENT = new Date(2026, 8, 23); // Date de lancement (mois 0-indexé : 8 = Septembre)

  const BADGE_ICONS = {
    'surface': '📐',
    'pièces': '🚪',
    'étage': '🏢',
    'meublé': '🪑',
    'parking': '🚗',
    'extérieur': '🌿',
    'état': '✨',
    'dpe': '⚡',
    'chauffage': '🔥',
    'transports': '🚇'
  };

  function getBadgeIcon(label) {
    const k = (label || '').toLowerCase();
    for (const key in BADGE_ICONS) {
      if (k.includes(key)) return BADGE_ICONS[key];
    }
    return '📌';
  }

  const DEPARTEMENTS = {
    '01':'Ain','02':'Aisne','03':'Allier','04':'Alpes-de-Haute-Provence','05':'Hautes-Alpes',
    '06':'Alpes-Maritimes','07':'Ardèche','08':'Ardennes','09':'Ariège','10':'Aube',
    '11':'Aude','12':'Aveyron','13':'Bouches-du-Rhône','14':'Calvados','15':'Cantal',
    '16':'Charente','17':'Charente-Maritime','18':'Cher','19':'Corrèze','2A':'Corse-du-Sud',
    '2B':'Haute-Corse','21':'Côte-d\'Or','22':'Côtes-d\'Armor','23':'Creuse','24':'Dordogne',
    '25':'Doubs','26':'Drôme','27':'Eure','28':'Eure-et-Loir','29':'Finistère',
    '30':'Gard','31':'Haute-Garonne','32':'Gers','33':'Gironde','34':'Hérault',
    '35':'Ille-et-Vilaine','36':'Indre','37':'Indre-et-Loire','38':'Isère','39':'Jura',
    '40':'Landes','41':'Loir-et-Cher','42':'Loire','43':'Haute-Loire','44':'Loire-Atlantique',
    '45':'Loiret','46':'Lot','47':'Lot-et-Garonne','48':'Lozère','49':'Maine-et-Loire',
    '50':'Manche','51':'Marne','52':'Haute-Marne','53':'Mayenne','54':'Meurthe-et-Moselle',
    '55':'Meuse','56':'Morbihan','57':'Moselle','58':'Nièvre','59':'Nord',
    '60':'Oise','61':'Orne','62':'Pas-de-Calais','63':'Puy-de-Dôme','64':'Pyrénées-Atlantiques',
    '65':'Hautes-Pyrénées','66':'Pyrénées-Orientales','67':'Bas-Rhin','68':'Haut-Rhin','69':'Rhône',
    '70':'Haute-Saône','71':'Saône-et-Loire','72':'Sarthe','73':'Savoie','74':'Haute-Savoie',
    '75':'Paris','76':'Seine-Maritime','77':'Seine-et-Marne','78':'Yvelines','79':'Deux-Sèvres',
    '80':'Somme','81':'Tarn','82':'Tarn-et-Garonne','83':'Var','84':'Vaucluse',
    '85':'Vendée','86':'Vienne','87':'Haute-Vienne','88':'Vosges','89':'Yonne',
    '90':'Territoire de Belfort','91':'Essonne','92':'Hauts-de-Seine','93':'Seine-Saint-Denis',
    '94':'Val-de-Marne','95':'Val-d\'Oise','971':'Guadeloupe','972':'Martinique',
    '973':'Guyane','974':'La Réunion','976':'Mayotte',
  };

  function getDepartement(annonce) {
    if (annonce.departement) return annonce.departement;
    // Fallback : extraire depuis le CP dans ville ou titre
    const cp = (annonce.ville + ' ' + (annonce.titre || '')).match(/\b(\d{5})\b/);
    if (!cp) return null;
    const code = cp[1].slice(0, 2);
    return DEPARTEMENTS[code] || null;
  }

  let currentIndex = 0;
  let ordre = [];
  let scores = [];
  let numJour = 1;

  // --- JOUR ---
  function getNumJour() {
    const testJour = parseInt(localStorage.getItem('cctl_testJour') || '');
    if (!isNaN(testJour) && testJour > 0) return testJour;
    const today = new Date();
    const todayLocal = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.round((todayLocal - DATE_LANCEMENT) / 86400000) + 1;
    return Math.max(diff, 1);
  }

  function getAnnoncesDuJour(num) {
    return ANNONCES.filter(a => a.jour === num);
  }

  // --- SAUVEGARDE QUOTIDIENNE ---
  function chargerSauvegarde(num) {
    try {
      const data = JSON.parse(localStorage.getItem('cctl_quotidien') || '{}');
      if (data.jour === num) return data;
    } catch {}
    return { jour: num, scores: [], index: 0, termine: false };
  }

  function sauvegarder() {
    const data = { jour: numJour, scores, index: currentIndex, termine: currentIndex >= NB_MANCHES };
    localStorage.setItem('cctl_quotidien', JSON.stringify(data));
  }

  // --- SOURCE BADGE ---
  function sourceAbbrev(source) {
    if (!source) return '?';
    const s = source.toLowerCase();
    if (s.includes('seloger')) return 'SL';
    if (s.includes('bien'))    return 'BI';
    if (s.includes('pap'))     return 'PAP';
    if (s.includes('boncoin') || s.includes('leboncoin')) return 'LBC';
    return source.slice(0, 3).toUpperCase();
  }
  function sourceCssClass(source) {
    if (!source) return 'source-def';
    const s = source.toLowerCase();
    if (s.includes('seloger')) return 'source-sl';
    if (s.includes('bien'))    return 'source-bi';
    if (s.includes('pap'))     return 'source-pap';
    if (s.includes('boncoin') || s.includes('leboncoin')) return 'source-lbc';
    return 'source-def';
  }

  function updateStoryHeader() {
    const segs = document.querySelectorAll('.story-segment');
    let totalScore = 0;
    
    segs.forEach((seg, i) => {
      seg.className = 'story-segment';
      if (scores[i] !== undefined) {
        totalScore += scores[i].score;
        if (scores[i].score >= 700) seg.classList.add('green');
        else if (scores[i].score >= 300) seg.classList.add('yellow');
        else seg.classList.add('red');
      } else if (i === currentIndex) {
        seg.classList.add('active');
      }
    });

    const liveScoreEl = document.getElementById('liveScorePill');
    if (liveScoreEl) liveScoreEl.textContent = `✨ ${totalScore.toLocaleString('fr-FR')} pts`;
    const stepEl = document.getElementById('storyStepText');
    if (stepEl) stepEl.textContent = `Manche ${Math.min(currentIndex + 1, NB_MANCHES)} sur ${NB_MANCHES}`;
  }

  // --- RENDER ---
  function renderAnnonce(a) {
    updateStoryHeader();
    const pos = currentIndex + 1;

    // Mise à jour de la barre de nav
    const btnPrev = document.getElementById('btnNavPrev');
    const btnNext = document.getElementById('btnNavNext');
    const navCounter = document.getElementById('navCounter');
    if (btnPrev) btnPrev.disabled = (currentIndex === 0);
    if (btnNext) btnNext.disabled = (scores[currentIndex] === undefined || currentIndex === NB_MANCHES - 1);
    if (navCounter) navCounter.textContent = `${pos} / ${NB_MANCHES}`;

    // Mise à jour Titre & Ville
    const titleText = document.getElementById('annonceTitleText');
    if (titleText) titleText.textContent = `📍 ${a.titre || (a.ville + (a.tooltip && a.tooltip !== a.ville ? ' · ' + a.tooltip : ''))}`;

    const dept = getDepartement(a);
    const deptTag = document.getElementById('annonceDeptTag');
    if (deptTag) {
      if (dept) {
        deptTag.textContent = dept;
        deptTag.style.display = 'inline-block';
      } else {
        deptTag.style.display = 'none';
      }
    }

    const villeEl = document.getElementById('annonceVilleText');
    if (villeEl) villeEl.textContent = `${a.ville}${a.sous_titre ? ' · ' + a.sous_titre : ''}`;

    // Mise à jour Badges
    const badgesHTML = a.badges.map(b =>
      `<div class="badge"><span class="badge-icon">${getBadgeIcon(b.label)}</span><div class="badge-content"><span class="label">${b.label}</span><span class="value">${b.value}</span></div></div>`
    ).join('') + (a.particularites ? `<div class="badge badge-full"><span class="badge-icon">✨</span><div class="badge-content"><span class="label">Particularités</span><span class="value">${a.particularites}</span></div></div>` : '');
    const badgeGrid = document.getElementById('badgeGridWrap');
    if (badgeGrid) badgeGrid.innerHTML = badgesHTML;

    // Mise à jour Note
    const noteWrap = document.getElementById('noteWrap');
    const noteText = document.getElementById('noteText');
    if (noteWrap && noteText) {
      if (a.note) {
        noteText.textContent = a.note;
        noteWrap.style.display = 'flex';
      } else {
        noteWrap.style.display = 'none';
      }
    }

    // Réinitialiser la zone d'estimation et le slider
    currentVal = SLIDER_DEFAULT;
    const slider = document.getElementById('slider');
    if (slider) slider.value = SLIDER_DEFAULT;
    const priceDisplay = document.getElementById('priceDisplayCentred');
    if (priceDisplay) priceDisplay.textContent = `${SLIDER_DEFAULT.toLocaleString('fr-FR')} €`;
    updateSliderBg(SLIDER_DEFAULT);

    // Bouton Voir l'annonce
    const btnAnnonceWrap = document.getElementById('btnAnnonceWrap');
    if (btnAnnonceWrap) {
      btnAnnonceWrap.innerHTML = a.lien ? `
        <a href="${a.lien}" target="_blank" rel="noopener" class="btn-annonce ${sourceCssClass(a.source)}" onclick="trackVoirAnnonce(this)">
          <span class="badge-source">${sourceAbbrev(a.source)}</span>
          Voir les photos de l'annonce
        </a>` : '';
    }

    // Restaurer résultat si déjà joué ou afficher le formulaire d'estimation
    if (scores[currentIndex] !== undefined) {
      afficherResultatExistant(scores[currentIndex], a);
    } else {
      document.getElementById('zoneEstimation').style.display = 'block';
      document.getElementById('resultat').style.display = 'none';
    }

    // Initialisation ou transition flyTo sur la carte existante
    initMap(a);
  }

  function afficherResultatExistant(r, a) {
    const v = getVerdict(r.score, r.ecart, currentIndex);
    document.getElementById('emojiVerdict').textContent = v.emoji;
    document.getElementById('verdictText').textContent = v.text;
    document.getElementById('verdictSub').textContent = v.sub;
    document.getElementById('estimAffiche').textContent = r.estimation.toLocaleString('fr-FR') + ' €';
    const ecartAbs = Math.abs(r.ecart);
    const colorClass = ecartAbs <= 50 ? 'green' : ecartAbs <= 150 ? 'orange' : 'red';
    const ecartStr = (r.ecart >= 0 ? '+' : '') + r.ecart.toLocaleString('fr-FR') + ' €';
    document.getElementById('loyerReel').innerHTML = `${a.loyer.toLocaleString('fr-FR')} €/mois <span style="font-size:0.82rem;font-weight:600" class="${colorClass}">(${ecartStr})</span>`;
    setTimeout(() => { document.getElementById('precisionFill').style.width = (r.score / 10) + '%'; }, 120);
    document.getElementById('scoreAffiche').textContent = r.score;
    const scoreBlock = document.querySelector('.score-block');
    if (scoreBlock) {
      scoreBlock.classList.remove('low-score', 'high-score');
      if (r.score < 100) scoreBlock.classList.add('low-score');
      else if (r.score > 850) scoreBlock.classList.add('high-score');
    }
    document.getElementById('zoneEstimation').style.display = 'none';
    document.getElementById('resultat').style.display = 'block';
    const estDerniere = currentIndex === NB_MANCHES - 1;
    document.getElementById('btnSuivante').style.display = estDerniere ? 'none' : 'block';
    document.getElementById('btnRecap').style.display = estDerniere ? 'block' : 'none';
  }

  // --- RÉCAP ---
  function getVerdictGlobal(total, max) {
    const pct = total / max;
    if (pct >= 0.9) return { emoji: '🏆', text: 'Expert du marché immo !', sub: pick(['Vous pouvez ouvrir votre agence.', 'On ne vous la fait pas.', 'Vous connaissez les prix sur le bout des doigts.', 'Chasseur immobilier en secret ?']) };
    if (pct >= 0.7) return { emoji: '🌟', text: 'Très bon score !', sub: pick(['Vous sentez le marché.', 'Quelques loyers vous ont résisté, mais pas beaucoup.', 'Les agences tremblent.', 'Vous avez l\'œil pour les prix.']) };
    if (pct >= 0.5) return { emoji: '🙂', text: 'Pas mal du tout !', sub: pick(['Vous commencez à sentir le marché.', 'Ni agent immo, ni novice — quelque part entre les deux.', 'Dans la moyenne, c\'est déjà ça !', 'Le marché ne vous a pas totalement eu.']) };
    if (pct >= 0.3) return { emoji: '😬', text: 'Peut mieux faire…', sub: pick(['Le marché vous a bien eu.', 'Le marché garde ses secrets.', 'Encore quelques parties et vous y serez.', 'Les loyers sont retors.']) };
    return { emoji: '💸', text: 'Aïe aïe aïe !', sub: pick(['Vous découvrez le marché immo français ?', 'Le marché n\'a fait qu\'une bouchée de vous.', 'Revenez demain, ça ira mieux !', 'Les prix vous ont bien eu cette fois.']) };
    // Variantes niçoises conservées : 'Tu débarques de Paris ?', 'En vacances dans la région, peut-être ?', 'Uno di noi !'
  }

  // --- STATISTIQUES JOUEUR ---
  function chargerStats() {
    try {
      return JSON.parse(localStorage.getItem('cctl_stats') || '{}');
    } catch { return {}; }
  }

  function mettreAJourStats(totalScore) {
    const stats = chargerStats();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = `${yesterday.getFullYear()}-${yesterday.getMonth()}-${yesterday.getDate()}`;

    // Mise à jour streak
    let currentStreak = stats.currentStreak || 0;
    let bestStreak = stats.bestStreak || 0;

    if (stats.lastPlayedDate === todayStr) {
      // Déjà joué aujourd'hui, on ne recompte pas
    } else if (stats.lastPlayedDate === yesterdayStr) {
      currentStreak += 1;
    } else {
      currentStreak = 1;
    }
    bestStreak = Math.max(bestStreak, currentStreak);

    const totalGames = (stats.totalGames || 0) + (stats.lastPlayedDate === todayStr ? 0 : 1);
    const totalScoreCumul = (stats.totalScoreCumul || 0) + (stats.lastPlayedDate === todayStr ? 0 : totalScore);

    const newStats = { currentStreak, bestStreak, totalGames, totalScoreCumul, lastPlayedDate: todayStr };
    localStorage.setItem('cctl_stats', JSON.stringify(newStats));
    return newStats;
  }

  // --- COMPTE À REBOURS ---
  let countdownInterval = null;

  function startCountdown() {
    function getSecondesRestantes() {
      const now = new Date();
      const minuit = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
      return Math.max(0, Math.floor((minuit - now) / 1000));
    }

    function formaterTemps(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function tick() {
      const restantes = getSecondesRestantes();
      const timerEl = document.getElementById('countdownTimer');
      const labelEl = document.getElementById('countdownLabel');
      const btnJouer = document.getElementById('btnJouerMaintenant');
      if (!timerEl) { clearInterval(countdownInterval); return; }

      if (restantes <= 0) {
        clearInterval(countdownInterval);
        timerEl.style.display = 'none';
        if (labelEl) labelEl.style.display = 'none';
        if (btnJouer) btnJouer.style.display = 'block';
      } else {
        timerEl.textContent = formaterTemps(restantes);
      }
    }

    if (countdownInterval) clearInterval(countdownInterval);
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function afficherRecap() {
    const total = scores.reduce((s, r) => s + r.score, 0);
    const max = NB_MANCHES * 1000;
    const v = getVerdictGlobal(total, max);
    if (typeof umami !== 'undefined') umami.track('partie-terminee', { score: total, jour: numJour });

    // Mettre à jour les stats
    const stats = mettreAJourStats(total);

    // Emojis style Wordle
    const emojisPartage = scores.map(r => {
      if (r.score >= 900) return '🟩';
      if (r.score >= 700) return '🟨';
      return '🟥';
    }).join('');

    const lignesHTML = scores.map((r, i) => {
      const a = ordre[i];
      const ecartStr = (r.ecart >= 0 ? '+' : '') + r.ecart.toLocaleString('fr-FR') + ' €';
      const couleur = r.score >= 900 ? 'vert' : r.score >= 700 ? 'orange' : 'rouge';
      return `
        <div class="recap-ligne ${couleur}">
          <span class="rl" style="flex:1;min-width:0;margin-right:10px">${i + 1}. ${a.ville}${a.tooltip && a.tooltip !== a.ville ? ' · ' + a.tooltip : ''}</span>
          <span style="display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap">
            <span class="rv">${r.score} pts</span>
            <span class="rv" style="font-size:0.8rem">${ecartStr}</span>
            ${a.lien ? `<a href="${a.lien}" target="_blank" rel="noopener" class="btn-annonce ${sourceCssClass(a.source)}" style="margin:0;padding:3px 0;font-size:0.75rem;border-width:1.5px;white-space:nowrap;width:64px;justify-content:center" onclick="trackVoirAnnonce(this,'recap')">
              <span class="badge-source" style="font-size:0.65rem;padding:1px 5px">${sourceAbbrev(a.source)}</span> →
            </a>` : ''}
          </span>
        </div>`;
    }).join('');

    // Streak banner
    const streakMsg = stats.currentStreak >= 2
      ? `${stats.currentStreak} jours de suite — continue !`
      : 'Day One! Reviens demain pour continuer ta série !';
    const bestMsg = stats.bestStreak > 1 ? `Meilleure série : ${stats.bestStreak} jour${stats.bestStreak > 1 ? 's' : ''}` : '';
    const scoreMoyen = stats.totalGames > 0 ? Math.round(stats.totalScoreCumul / stats.totalGames).toLocaleString('fr-FR') : '—';

    document.getElementById('card').innerHTML = `
      <div class="recap-block">
        <div class="recap-emoji">${v.emoji}</div>
        <div class="recap-title">${v.text}</div>
        <div class="recap-sub">${v.sub}</div>
        <div class="recap-score-label">Score — Partie #${numJour}</div>
        <div class="recap-score" id="recapScoreAnim">0</div>
        <div class="recap-score-max">/ ${max.toLocaleString('fr-FR')} points</div>
      </div>
      <div class="recap-detail">${lignesHTML}</div>

      <div class="stats-panel">
        <div class="stats-panel-title">Mes statistiques</div>
        <div class="stats-inline-grid">
          <div class="stat-inline-cell">
            <div class="sic-val">${stats.totalGames}</div>
            <div class="sic-lbl">Parties</div>
          </div>
          <div class="stat-inline-cell">
            <div class="sic-val">${scoreMoyen}</div>
            <div class="sic-lbl">Score moyen</div>
          </div>
          <div class="stat-inline-cell">
            <div class="sic-val fire">${stats.currentStreak}🔥</div>
            <div class="sic-lbl">Série</div>
          </div>
        </div>
        <div class="streak-banner">
          <div class="sb-fire">🔥</div>
          <div class="sb-text">
            <div class="sb-main">${streakMsg}</div>
            ${bestMsg ? `<div class="sb-sub">${bestMsg}</div>` : ''}
          </div>
        </div>
      </div>

      <div class="countdown-block">
        <div class="countdown-label" id="countdownLabel">Prochaine partie dans</div>
        <div class="countdown-timer" id="countdownTimer">—</div>
      </div>
      <button class="btn-jouer-maintenant" id="btnJouerMaintenant" onclick="location.reload()">Jouer maintenant →</button>
      <button class="btn-partager" onclick="partagerRecap(${total}, ${max}, '${emojisPartage}')">📤 Partager mon score</button>
    `;

    animerScoreEl(document.getElementById('recapScoreAnim'), total);
    if (total > 4000) {
      setTimeout(fireVictoryCannons, 300);
    }
    startCountdown();
    forceScrollTop();

    // Marquer comme terminé
    sauvegarder();
  }

  function trackVoirAnnonce(el, context) {
    if (typeof umami === 'undefined') return;
    const url = el.href || '';
    const plateforme = url.includes('seloger') ? 'SeLoger' : url.includes('bienici') ? "Bien'ici" : url.includes('pap.fr') ? 'PAP' : url.includes('leboncoin') ? 'LeBonCoin' : '?';
    umami.track('voir-annonce', { plateforme, context: context || 'manche' });
  }

  function partagerRecap(total, max, emojis) {
    const lien = 'https://bleueb.github.io/c-est-combien-le-loyer/';
    const totalStr = total.toLocaleString('fr-FR');
    const maxStr = max.toLocaleString('fr-FR');
    const texte = `🏠 C'est Combien Le Loyer ? — Partie #${numJour}\nScore : ${totalStr} / ${maxStr} pts 🏆\n${emojis}\n${lien}`;
    if (typeof umami !== 'undefined') umami.track('score-partage', { score: total, jour: numJour });
    if (navigator.share) {
      navigator.share({ title: "C'est Combien Le Loyer ?", text: texte }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(texte).then(() => {
        const btn = document.querySelector('.btn-partager');
        const original = btn.innerHTML;
        btn.innerHTML = '✅ Score copié !';
        btn.disabled = true;
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
      });
    }
  }

  // --- MAPBOX 3D (Streets-v12) ---
  mapboxgl.accessToken = 'pk.eyJ1IjoiYmxldWViIiwiYSI6ImNtdXFwa3l3ajAwMzQyd3BpMDZvYWVkdnIifQ.NgG1-eQ8nRatu40mDtS8dA';
  let mapboxInstance = null;
  let mapboxMarker = null;

  function initMap(a) {
    const coordsLngLat = [a.coords[1], a.coords[0]];
    const targetZoom = a.zoom ? Math.max(a.zoom + 0.8, 16) : 16.3;

    if (!mapboxInstance) {
      if (typeof umami !== 'undefined') {
        umami.track('carte-chargee', { style: 'streets-v12', jour: numJour });
      }

      mapboxInstance = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: coordsLngLat,
        zoom: targetZoom,
        pitch: 52,
        bearing: -12,
        antialias: true,
        trackResize: false,
        keyboard: false
      });

      mapboxInstance.addControl(new mapboxgl.NavigationControl({ showCompass: true, visualizePitch: true }), 'top-right');

      mapboxInstance.on('style.load', () => {
        ajouterBatiments3D();
        placerMarker(a);
      });
    } else {
      // Grand survol aérien avec dézoom/rezoom fluide à travers la France (légèrement plus véloce)
      mapboxInstance.flyTo({
        center: coordsLngLat,
        zoom: targetZoom,
        pitch: 52,
        bearing: -12 + (Math.random() * 8 - 4),
        speed: 1.45,
        curve: 1.4,
        essential: true
      });
      placerMarker(a);
    }
  }

  function ajouterBatiments3D() {
    if (!mapboxInstance || !mapboxInstance.getStyle()) return;
    const layers = mapboxInstance.getStyle().layers;
    const labelLayerId = layers.find(
      (layer) => layer.type === 'symbol' && layer.layout && layer.layout['text-field']
    )?.id;

    if (!mapboxInstance.getLayer('add-3d-buildings')) {
      mapboxInstance.addLayer(
        {
          id: 'add-3d-buildings',
          source: 'composite',
          'source-layer': 'building',
          filter: ['==', 'extrude', 'true'],
          type: 'fill-extrusion',
          minzoom: 14,
          paint: {
            'fill-extrusion-color': '#d1d5db',
            'fill-extrusion-height': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14,
              0,
              15.05,
              ['get', 'height']
            ],
            'fill-extrusion-base': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14,
              0,
              15.05,
              ['get', 'min_height']
            ],
            'fill-extrusion-opacity': 0.65
          }
        },
        labelLayerId
      );
    }
  }

  function placerMarker(a) {
    if (mapboxMarker) {
      mapboxMarker.remove();
    }
    const coordsLngLat = [a.coords[1], a.coords[0]];
    const el = document.createElement('div');
    el.className = 'custom-house-pin';
    el.innerHTML = `
      <div class="custom-house-pin-animated" style="display:flex;flex-direction:column;align-items:center">
        <div class="custom-tooltip-3d">${a.tooltip || a.ville}</div>
        <div class="pin-emoji">📍</div>
      </div>
    `;

    mapboxMarker = new mapboxgl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat(coordsLngLat)
      .addTo(mapboxInstance);
  }

  // --- SLIDER & ESTIMATION ---
  let currentVal = SLIDER_DEFAULT;

  function updateSliderBg(val) {
    const pct = ((val - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN)) * 100;
    const slider = document.getElementById('slider');
    if (slider) {
      slider.style.background =
        `linear-gradient(to right, #c4622d 0%, #c4622d ${pct}%, #f0d8cc ${pct}%, #f0d8cc 100%)`;
    }
  }

  function syncFromSlider(val) {
    currentVal = Math.min(Math.max(parseInt(val) || SLIDER_MIN, SLIDER_MIN), SLIDER_MAX);
    const priceEl = document.getElementById('priceDisplayCentred');
    if (priceEl) priceEl.textContent = currentVal.toLocaleString('fr-FR') + ' €';
    updateSliderBg(currentVal);
  }

  function adjustAmount(delta) {
    currentVal = Math.min(Math.max((currentVal || SLIDER_DEFAULT) + delta, SLIDER_MIN), SLIDER_MAX);
    const slider = document.getElementById('slider');
    if (slider) slider.value = currentVal;
    const priceEl = document.getElementById('priceDisplayCentred');
    if (priceEl) priceEl.textContent = currentVal.toLocaleString('fr-FR') + ' €';
    updateSliderBg(currentVal);
  }

  // Raccourcis clavier (←/→ : ±10€, Shift+←/→ : ±50€, Entrée : Valider)
  window.addEventListener('keydown', (e) => {
    const zoneEst = document.getElementById('zoneEstimation');
    if (!zoneEst || zoneEst.style.display === 'none') {
      if (e.key === 'Enter') {
        const btnSuiv = document.getElementById('btnSuivante');
        const btnRecap = document.getElementById('btnRecap');
        if (btnSuiv && btnSuiv.style.display !== 'none') btnSuiv.click();
        else if (btnRecap && btnRecap.style.display !== 'none') btnRecap.click();
      }
      return;
    }

    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      adjustAmount(e.shiftKey ? -50 : -10);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      adjustAmount(e.shiftKey ? 50 : 10);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      adjustAmount(-50);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      adjustAmount(50);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      valider();
    }
  });

  // --- SCORE ---
  function calculerScore(estimation, reel) {
    const ecartPct = Math.abs(estimation - reel) / reel;
    if (ecartPct <= 0.03) return 1000; // À 3% près = score maximal parfait
    const sigma = 0.38; // Courbe douce et récompensante
    const score = 1000 * Math.exp(-Math.pow(ecartPct - 0.03, 2) / (2 * sigma * sigma));
    return Math.round(Math.max(score, 0));
  }

  // --- CONFETTIS ---
  function fireConfettiManche() {
    if (typeof confetti === 'undefined') return;
    confetti({
      particleCount: 50,
      spread: 55,
      origin: { y: 0.65 },
      colors: ['#c4622d', '#16a34a', '#f59e0b', '#3b82f6', '#ec4899']
    });
  }

  function fireVictoryCannons() {
    if (typeof confetti === 'undefined') return;
    const end = Date.now() + 1400;
    const colors = ['#c4622d', '#16a34a', '#f59e0b', '#3b82f6'];
    (function frame() {
      confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors });
      confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors });
      if (Date.now() < end) requestAnimationFrame(frame);
    }());
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function getVerdict(score, ecart = 0, indexManche = currentIndex) {
    if (score >= 900) {
      const subs = [
        'Vrai expert immo ou vrai coup de chance ?',
        'J\'en connais un qui tient les comptes.',
        'On ne te la fait pas, à toi.',
        'Une vision d\'aigle…',
        'Chasseur immobilier en secret ?',
        'T\'es le propriétaire ou quoi ?',
        'Même l\'agent immobilier n\'était pas aussi précis.',
        'Tu passes trop de temps sur SeLoger le dimanche soir.',
        'Dossier accepté sans garant, direct.',
        'Stéphane Plaza en sueur.',
        'Tu as le bail sous les yeux, avoue.',
        'TOUT SIMPLEMENT FABULEUX'
      ];
      // Si la manche précédente était moyenne ou faible (< 700 pts)
      if (indexManche > 0 && scores[indexManche - 1] && scores[indexManche - 1].score < 500) {
        subs.push('IL EST DE RETOUR !');
      }
      return { emoji: '🎯', text: pick(['Trop fort !', 'Monstrueux !', 'Parfait !', 'Redoutable !']), sub: pick(subs) };
    }

    if (score >= 700) {
      const subs = [
        'Vous connaissez bien ce marché !',
        'Vous avez déjà cherché un appart par ici ?',
        'Excellent sens du marché.',
        'On sent que tu as déjà épluché les annonces du coin.',
        'Presque au centime près, respect.',
        'L\'œil du pro, il te manquait juste le coût du local vélo.'
      ];
      return { emoji: '🔥', text: pick(['Vraiment pas mal !', 'Vous avez l\'œil !', 'Solide !']), sub: pick(subs) };
    }

    if (score >= 450) {
      const subs = [
        'Ce marché vous réserve encore des surprises.',
        'Vous vous défendez bien !',
        'Pas loin !',
        'Tu as oublié de compter les charges de copro ?',
        'Le marché a encore quelques petits secrets pour toi.',
        'C\'est le supplément "charme de l\'ancien" qui t\'a trompé.'
      ];
      if (ecart < 0) {
        subs.push('Pas si loin, mais le proprio a été un poil plus gourmand.');
      } else if (ecart > 0) {
        subs.push('Pas si loin, mais le proprio a été un poil moins gourmand.');
      }
      return { emoji: '👍', text: pick(['Peut mieux faire !', 'Dans la bonne fourchette !']), sub: pick(subs) };
    }

    if (score >= 150) {
      const subs = [
        'Les loyers sont retors par ici…',
        'Le marché vous a eu cette fois !',
        'Difficile à estimer !',
        'Crucifié…',
        'À ce prix-là, t\'as juste la cave et le local poubelles.',
        'Tu as estimé les prix en francs ou quoi ?'
      ];
      if (ecart < 0) {
        subs.push('Le propriétaire vient de faire un malaise en voyant ton offre.');
      }
      return { emoji: '😅', text: 'Ouch !', sub: pick(subs) };
    }

    const subs = [
      'Le marché n\'a pas fini de vous surprendre.',
      'Vous découvrez le marché immo français ?',
      'Revenez demain !',
      'Crucifié…',
      'Dossier refusé immédiatement, même avec 12 garants en CDI.',
      'Complètement à côté de la plaque (et du département).'
    ];
    if (ecart < 0) {
      subs.push('Tu vis encore chez tes parents, non ?');
    }
    return { emoji: '💸', text: 'Aïe !', sub: pick(subs) };
  }

  function valider() {
    const sliderEl = document.getElementById('slider');
    const estimation = currentVal || (sliderEl ? parseInt(sliderEl.value) : SLIDER_DEFAULT);
    const a = ordre[currentIndex];
    const score = calculerScore(estimation, a.loyer);
    const ecart = estimation - a.loyer;
    const ecartAbs = Math.abs(ecart);
    const verdict = getVerdict(score, ecart, currentIndex);
    scores[currentIndex] = { estimation, score, ecart };
    sauvegarder();
    updateStoryHeader();
    if (typeof umami !== 'undefined') {
      umami.track('manche-validee', { manche: currentIndex + 1, score, jour: numJour });
      const stats = chargerStats();
      if (currentIndex === NB_MANCHES - 1 && stats.currentStreak >= 3) {
        umami.track('streak-atteint', { streak: stats.currentStreak, jour: numJour });
      }
    }

    document.getElementById('emojiVerdict').textContent = verdict.emoji;
    document.getElementById('verdictText').textContent = verdict.text;
    document.getElementById('verdictSub').textContent = verdict.sub;
    document.getElementById('estimAffiche').textContent = estimation.toLocaleString('fr-FR') + ' €';
    const colorClass = ecartAbs <= 50 ? 'green' : ecartAbs <= 150 ? 'orange' : 'red';
    const diffPct = ((ecart / a.loyer) * 100).toFixed(1);
    const ecartStr = (ecart >= 0 ? '+' : '') + ecart.toLocaleString('fr-FR') + ' € / ' + (ecart >= 0 ? '+' : '') + diffPct + '%';
    document.getElementById('loyerReel').innerHTML = `${a.loyer.toLocaleString('fr-FR')} €/mois <span style="font-size:0.82rem;font-weight:600" class="${colorClass}">(${ecartStr})</span>`;
    setTimeout(() => { document.getElementById('precisionFill').style.width = (score / 10) + '%'; }, 120);
    animerScore(score);
    if (score >= 900) {
      setTimeout(fireConfettiManche, 200);
    }
    const scoreBlock = document.querySelector('.score-block');
    if (scoreBlock) {
      scoreBlock.classList.remove('low-score', 'high-score');
      if (score < 100) scoreBlock.classList.add('low-score');
      else if (score > 850) scoreBlock.classList.add('high-score');
    }
    document.getElementById('zoneEstimation').style.display = 'none';
    document.getElementById('resultat').style.display = 'block';
    const estDerniere = currentIndex === NB_MANCHES - 1;
    document.getElementById('btnSuivante').style.display = estDerniere ? 'none' : 'block';
    document.getElementById('btnRecap').style.display = estDerniere ? 'block' : 'none';
    document.getElementById('resultat').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    sauvegarder();
  }

  function animerScore(score) { animerScoreEl(document.getElementById('scoreAffiche'), score); }
  function animerScoreEl(el, cible) {
    const duree = 900, debut = Date.now();
    function tick() {
      const t = Math.min((Date.now() - debut) / duree, 1);
      el.textContent = Math.round((1 - Math.pow(1 - t, 3)) * cible);
      if (t < 1) requestAnimationFrame(tick); else el.textContent = cible;
    }
    requestAnimationFrame(tick);
  }

  // --- NAVIGATION ---
  function forceScrollTop() {
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  function goTo(index) {
    if (index < 0 || index >= NB_MANCHES) return;
    currentIndex = index;

    // Retirer le focus de tout bouton actif pour empêcher le navigateur de recentrer la vue
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }

    renderAnnonce(ordre[currentIndex]);
    forceScrollTop();
    requestAnimationFrame(forceScrollTop);
    [20, 60, 150, 300, 600].forEach(d => setTimeout(forceScrollTop, d));
  }

  // --- INIT ---
  numJour = getNumJour();
  document.getElementById('headerSub').textContent = `Partie #${numJour}`;

  const annonces = getAnnoncesDuJour(numJour);

  if (annonces.length < NB_MANCHES) {
    document.getElementById('card').innerHTML = `
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:2rem;margin-bottom:16px">🔜</div>
        <div style="font-weight:800;font-size:1.1rem;margin-bottom:8px">Partie #${numJour} pas encore disponible</div>
        <div style="color:#57606a;font-size:0.9rem;margin-bottom:24px">Revenez demain !</div>
        <a href="index.html" style="color:#3b82d4;font-weight:700">← Retour à l'accueil</a>
      </div>`;
  } else {
    ordre = annonces;

    // Restaurer progression
    const save = chargerSauvegarde(numJour);
    scores = save.scores || [];
    currentIndex = Math.min(save.index || 0, NB_MANCHES - 1);

    // Si partie déjà terminée, aller direct au récap
    if (save.termine) {
      afficherRecap();
    } else {
      if (typeof umami !== 'undefined') umami.track('partie-commencee', { jour: numJour });
      renderAnnonce(ordre[currentIndex]);
    }
  }
</script>
